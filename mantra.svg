<svg xmlns="http://www.w3.org/2000/svg" width="640" height="110" viewBox="0 0 640 110" fill="none" font-family="'JetBrains Mono','Fira Code','Courier New',monospace">
  <defs>
    <clipPath id="print">
      <rect x="64" y="66" width="560" height="34">
        <animate attributeName="width" dur="34s" repeatCount="indefinite"
          keyTimes="0;0.1;0.1294;0.985;1" values="0;0;510;510;0"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Line 1: the reactive question, orange -->
  <text x="320" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#F4622A">What went wrong? How do I fix it?
    <animate attributeName="opacity" dur="34s" repeatCount="indefinite"
      keyTimes="0;0.0118;0.0882;0.1;0.985;1" values="0;1;1;0.55;0.55;0"/>
  </text>

  <!-- The strike-through that draws across line 1 and remains -->
  <line x1="122" y1="37" x2="122" y2="37" stroke="#F4622A" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="x2" dur="34s" repeatCount="indefinite"
      keyTimes="0;0.0588;0.0824;0.985;1" values="122;122;518;518;122"/>
    <animate attributeName="opacity" dur="34s" repeatCount="indefinite"
      keyTimes="0;0.0588;0.0824;0.985;1" values="0;0;1;1;0"/>
  </line>

  <!-- Line 2: the proactive question, logo blue, prints on top -->
  <text x="320" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#5091D7" clip-path="url(#print)">What could go wrong? How do we prevent it?</text>
</svg>
